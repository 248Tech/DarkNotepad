name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dark Notepad version
      placeholder: "1.0.0"
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2 / Windows 10 22H2"
  - type: input
    id: ps
    attributes:
      label: PowerShell version
      description: Output of `$PSVersionTable.PSVersion`
